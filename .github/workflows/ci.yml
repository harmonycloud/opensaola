name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          install-mode: goinstall

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: make test
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out
      - name: Check coverage threshold
        run: make check-coverage

  test-race:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests with race detector
        run: make test-race

  envtest:
    name: API Server Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Setup envtest binaries
        run: make setup-envtest
      - name: Run API server integration tests
        run: make test-envtest

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: make build

  helm-chart:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - helm: v4.3.2
            check: Helm Chart
          - helm: v3.18.3
            check: Helm Chart (v3)
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.helm }}
      - name: Check Helm chart
        run: make helm-check

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Kind
        run: |
          [ -f /usr/local/bin/kind ] || {
            curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
            chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          }
      - name: Run E2E smoke
        run: make test-e2e-smoke
        timeout-minutes: 15
      - name: Verify field management and Redis persistence on fresh Kind
        run: make test-fields-redis
        timeout-minutes: 25
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.3
      - name: Verify Helm catalog namespace retention on fresh Kind
        run: make test-helm-data-namespace
        timeout-minutes: 10

  verify:
    name: Verify Generated Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check manifests and generated code
        run: |
          make manifests generate
          git diff --exit-code || (echo "Generated code is out of date. Run 'make manifests generate' and commit." && exit 1)

  license:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check license headers
        run: |
          go install github.com/google/addlicense@latest
          addlicense -check -f hack/boilerplate.go.txt $(find cmd internal api pkg -name '*.go' ! -name 'zz_generated*')
